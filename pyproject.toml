[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ugpo"
version = "0.1.0"
description = "Use-Grouped Policy Optimization (UGPO) for Long-Context Memory Agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.46.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0.1",
    "pyarrow>=15.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
full = [
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
